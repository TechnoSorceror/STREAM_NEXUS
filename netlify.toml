[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  function = "seo"
  path = "/*"
  excludedPath = ["/assets/*", "/*.ico", "/*.jpg", "/*.jpeg", "/*.png", "/*.webp", "/*.svg", "/*.woff", "/*.woff2"]

# The Netlify-owned URL is an access path, not a second indexable website.
[[redirects]]
  from = "https://streamnexusru.netlify.app/*"
  to = "https://streamnexus.fun/:splat"
  status = 301
  force = true

# Downstream fallback used by the edge renderer and client-side navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/og-seo.jpg"

  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
    X-Content-Type-Options = "nosniff"
